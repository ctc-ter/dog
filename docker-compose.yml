version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: dog-rescue-db
    environment:
      POSTGRES_DB: dog_rescue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./src/backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: dog-rescue-redis
    ports:
      - "6379:6379"

  backend:
    build: ./src/backend
    container_name: dog-rescue-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dog_rescue
      SPRING_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/uploads

  nginx:
    image: nginx:alpine
    container_name: dog-rescue-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./src/frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  pg_data:

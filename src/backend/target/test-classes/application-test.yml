server:
  port: 8081

spring:
  sql:
    init:
      mode: never
  application:
    name: dog-rescue-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: dog-rescue-jwt-secret-key-2024-very-long-and-secure
  expiration: 86400000

file:
  upload-path: ./uploads

dashscope:
  api-key: test-key
  model: qwen-vl-max
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
